services:
  # ── Backend: Express API ────────────────────────────────────────────────────
  - type: web
    name: arivuyirkhol-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false          # Set this in the Render dashboard
      - key: CLIENT_ORIGIN
        sync: false          # Set to your frontend URL after it is deployed
      - key: PORT
        value: "10000"       # Render assigns this port automatically; Express reads it

  # ── Frontend: React + Vite static site ─────────────────────────────────────
  - type: web
    name: arivuyirkhol-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend URL, e.g. https://arivuyirkhol-api.onrender.com

